<meta charset="UTF-8">

<style>
:root{--bg:#0b0b13;--panel:#171723;--line:#303044;--text:#f6f3ff;--muted:#b3adbf;--accent:#c9a0ff;--accent2:#ff9bbd}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(ellipse 70% 26% at 50% 0%,#2b1b40 0%,transparent 78%),var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}a{color:inherit;text-decoration:none}
.topbar{border-bottom:1px solid #ffffff12;background:#0b0b13b8;backdrop-filter:blur(16px);position:sticky;top:0;z-index:10}.nav{max-width:1260px;margin:auto;min-height:74px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}.logo{font-weight:900;font-size:21px;letter-spacing:.09em}.logo span{color:var(--accent)}.navlink{font-size:14px;color:var(--muted)}.navlink:hover{color:white}
main{max-width:1260px;margin:auto;padding:36px 24px 0}.eyebrow{color:var(--accent);font-weight:800;letter-spacing:.16em;font-size:11px;text-transform:uppercase}.intro{margin:0 0 25px}.intro h1{font-size:clamp(26px,4vw,44px);letter-spacing:-.04em;margin:7px 0 6px}.intro p{color:var(--muted);margin:0;font-size:15px}
.hero{position:relative;display:block;overflow:hidden;border-radius:24px;min-height:330px;aspect-ratio:2.6;background:#242130;border:1px solid #ffffff1a;isolation:isolate}.hero img{width:100%;height:100%;object-fit:cover;object-position:center 42%;position:absolute;inset:0;transition:transform .6s}.hero:hover img{transform:scale(1.035)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#090713bf,transparent 70%),linear-gradient(0deg,#090713a8,transparent 60%);z-index:0}.hero-content{position:absolute;z-index:1;left:clamp(22px,4vw,58px);bottom:clamp(22px,4vw,46px);max-width:70%}.hero h2{font-size:clamp(26px,4vw,49px);line-height:1.12;letter-spacing:-.04em;margin:10px 0}.hero p{color:#eee1ff;margin:0 0 19px}.cta{display:inline-flex;align-items:center;gap:9px;background:#f1ddff;color:#24112e;font-weight:800;border-radius:999px;padding:11px 20px;font-size:13px}.cta:after{content:"↗"}
.section-title{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:46px 0 20px}.section-title h2{margin:3px 0 0;font-size:clamp(22px,3vw,30px);letter-spacing:-.03em}.count{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px}.card{min-width:0;background:linear-gradient(155deg,#201b2b,#13131d);border:1px solid var(--line);border-radius:17px;overflow:hidden;transition:transform .25s,border-color .25s,box-shadow .25s}.card:hover{transform:translateY(-6px);border-color:#9d73d4;box-shadow:0 15px 35px #0006}.cover{position:relative;overflow:hidden;background:#292433}.cover img{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;transition:transform .4s}.card:hover .cover img{transform:scale(1.06)}.tag{position:absolute;top:11px;left:11px;background:#110c19c9;border:1px solid #ffffff35;border-radius:999px;padding:5px 10px;font-size:10px;font-weight:800;backdrop-filter:blur(8px)}.info{padding:14px 14px 16px}.info h3{margin:0;font-size:15px;line-height:1.4;min-height:42px}.info p{font-size:12px;color:var(--muted);margin:7px 0 12px}.view{font-size:12px;font-weight:800;color:var(--accent)}footer{margin-top:65px;border-top:1px solid #ffffff14;text-align:center;color:#888395;font-size:13px;padding:29px 16px}
@media(max-width:1000px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}@media(max-width:650px){.nav{min-height:62px;padding:0 16px}.logo{font-size:17px}.navlink{font-size:12px}main{padding:25px 14px 0}.hero{min-height:310px;aspect-ratio:1.25;border-radius:17px}.hero img{object-position:64% center}.hero-content{max-width:90%;left:20px;bottom:24px}.hero h2{font-size:30px}.hero p{font-size:13px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{border-radius:13px}.info{padding:11px}.info h3{font-size:13px;min-height:36px}.section-title{margin-top:34px}.tag{font-size:9px}}

/* ANIMATED FANTASY BACKGROUND */
body{position:relative;isolation:isolate;background:#090913}
body:before{content:"";position:fixed;inset:-20%;z-index:-3;pointer-events:none;background:radial-gradient(ellipse at 18% 28%,#6e2f8952,transparent 42%),radial-gradient(ellipse at 82% 65%,#37528b4d,transparent 43%),radial-gradient(ellipse at 55% 95%,#9a3e7250,transparent 46%);filter:blur(38px);animation:ambientFlow 18s ease-in-out infinite alternate}
@keyframes ambientFlow{0%{transform:translate3d(-3%,0,0) scale(1)}100%{transform:translate3d(4%,-3%,0) scale(1.13)}}
#fantasy-bg{position:fixed;inset:0;pointer-events:none;z-index:-1;overflow:hidden}
.fantasy-petal{position:absolute;top:-12vh;width:var(--size);height:calc(var(--size)*.7);border-radius:85% 5% 85% 12%;background:linear-gradient(135deg,#ffdaee,#ed93d2 65%,#c57db8);opacity:var(--opacity);filter:drop-shadow(0 0 6px #ffc2e455);animation:petalFall var(--duration) linear var(--delay) infinite;transform:rotate(35deg)}
.fantasy-spark{position:absolute;width:var(--size);height:var(--size);border-radius:50%;background:#fff0fa;box-shadow:0 0 9px 3px #f3aaff88;animation:sparkle var(--duration) ease-in-out var(--delay) infinite alternate}
@keyframes petalFall{0%{transform:translate3d(0,-10vh,0) rotate(0deg)}50%{transform:translate3d(55px,55vh,0) rotate(220deg)}100%{transform:translate3d(-35px,120vh,0) rotate(480deg)}}
@keyframes sparkle{0%{opacity:.1;transform:scale(.45)}100%{opacity:.8;transform:scale(1.4)}}
.motion-toggle{border:1px solid #ffffff44;background:#1c152ac9;color:#f4e8ff;border-radius:999px;padding:9px 13px;font:inherit;font-size:12px;cursor:pointer}
.motion-off .fantasy-petal,.motion-off .fantasy-spark{display:none}
.motion-off:before{animation:none}
@media(prefers-reduced-motion:reduce){body:before,.fantasy-petal,.fantasy-spark{animation:none!important}.fantasy-petal{display:none}}
@media(max-width:650px){.motion-toggle{font-size:11px;padding:8px}.navlink{display:none}}

/* NAVIGATION LIKE CINEMA CATALOG */
.catalog-toolbar{max-width:1260px;margin:0 auto 22px;padding:0 24px}
.catalog-search{display:flex;align-items:center;gap:12px;background:#17171e;border:1px solid #3a3441;border-radius:999px;padding:0 17px;max-width:480px;height:43px;margin:18px auto;color:#b9a9c6}
.catalog-search input{background:transparent;border:0;outline:0;color:#fff;width:100%;font:inherit;font-size:14px}
.catalog-search input::placeholder{color:#aaa1b1}
.catalog-menu{display:flex;overflow-x:auto;scrollbar-width:thin;background:#1b1b23;border:1px solid #34303b;border-radius:12px;white-space:nowrap}
.catalog-menu button{flex:1 0 auto;border:0;border-right:1px solid #34303b;padding:16px 13px;background:transparent;color:#c8c4ce;font:inherit;font-size:13px;font-weight:750;cursor:pointer;transition:background .2s,color .2s}
.catalog-menu button:last-child{border-right:0}.catalog-menu button:hover{background:#30263b;color:#fff}.catalog-menu button.active{color:#ff8b77;background:#32222f;box-shadow:inset 0 -3px #ff5c79}
.catalog-menu .menu-icon{margin-right:7px;font-size:15px}
.search-empty{padding:24px;text-align:center;color:#c8c1d1;border:1px dashed #65546f;border-radius:14px;grid-column:1/-1}
@media(max-width:650px){.catalog-toolbar{padding:0 14px;margin-bottom:15px}.catalog-search{margin:12px auto}.catalog-menu button{padding:13px 14px;font-size:12px}}
</style>

<body><div id="fantasy-bg" aria-hidden="true"></div>
<header class="topbar"><nav class="nav"><a class="logo" href="./" id="logo">ANIME <span>GALLERY</span></a><div style="display:flex;align-items:center;gap:16px"><a class="navlink" href="#gallery">Khám phá bộ sưu tập ↓</a><button class="motion-toggle" id="motionToggle" type="button" aria-pressed="true">✦ Tắt nền động</button></div></nav></header>
<div class="catalog-toolbar"><label class="catalog-search"><span aria-hidden="true">⌕</span><input id="catalogSearch" type="search" placeholder="Nhập từ khóa tìm kiếm..." aria-label="Tìm kiếm bộ sưu tập"></label><nav class="catalog-menu" id="catalogMenu" aria-label="Danh mục"></nav></div>
<main>
<section class="intro"><div class="eyebrow" id="eyebrow"></div><h1 id="pageTitle"></h1><p id="pageDescription"></p></section>
<a id="heroLink" class="hero" target="_blank" rel="noopener noreferrer sponsored"><img id="heroImage" src="images/03.jpg" alt="Banner chính"><div class="hero-content"><div class="eyebrow" id="heroLabel"></div><h2 id="heroTitle"></h2><p id="heroDescription"></p><span class="cta" id="heroButton"></span></div></a>
<section id="gallery"><div class="section-title"><div><div class="eyebrow">BỘ SƯU TẬP</div><h2 id="sectionTitle"></h2></div><span class="count" id="itemCount"></span></div><div class="grid" id="cards"></div></section>
</main><footer id="footer"></footer>
<script>
/* =====================================================================
   KHU VỰC CHỈNH SỬA — ANH CHỈ CẦN SỬA PHẦN NÀY
   Đổi chữ trong dấu nháy "..." rồi Commit changes trên GitHub.
   Muốn thay ảnh: tải ảnh mới vào thư mục images và đổi image.
   Muốn thay link Shopee: sửa link tương ứng (đầy đủ https://...).
   ===================================================================== */
const CONFIG = {
  // Nền động: đổi true thành false nếu muốn tắt mặc định
  animatedBackground: true,
  websiteName: "ANIME GALLERY",
  // ===== THANH MENU — ANH CÓ THỂ ĐỔI TÊN TỪNG Ô =====
  menuNames: ["Trang chủ", "Thể loại", "Phim Lẻ", "Đang Chiếu", "Lịch Chiếu", "Hoàn Thành", "Top 10 HH3D", "Đánh Giá Cao"],
  smallLabel: "KHÁM PHÁ THẾ GIỚI HÌNH ẢNH",
  pageTitle: "Bộ sưu tập nổi bật",
  pageDescription: "Khám phá những hình ảnh ấn tượng được tuyển chọn dành cho bạn.",
  sectionTitle: "Khám phá bộ sưu tập",
  footerText: "© 2026 Anime Gallery. All rights reserved.",

 // ===== BANNER LỚN — ẢNH SỐ 03 =====
  banner: {
    image: "images/03.jpg",
    label: "LỰA CHỌN NỔI BẬT",
    title: "Những nhân vật bạn từng xem trong bộ trang phục mới",
    description: "Những hình ảnh ấn tượng 18+ đang chờ bạn.",
    button: "Khám phá ngay",
    link: "https://s.shopee.vn/2LZ0SXPNQQ"
  },

  // ===== 10 MỤC ẢNH NHỎ — SỬA title, description, link TỪNG MỤC =====
  items: [
    { image:"images/01.jpg", title:"Cô giáo nhỏ của tôi", description:"Khám phá ngay", link:"https://s.shopee.vn/1BN34CY2y9" },
    { image:"images/02.jpg", title:"Xuyên không gặp cô cô hồi xuân", description:"Khám phá ngay", link:"https://s.shopee.vn/5VW2EBiMyP" },
    { image:"images/04.jpg", title:"Tiểu tỷ tỷ thích tắm cùng tôi", description:"Khám phá ngay", link:"https://s.shopee.vn/1gJJf9ep3D" },
    { image:"images/05.jpg", title:"Ân ái với nữ vương lạnh lùng", description:"Khám phá ngay", link:"https://s.shopee.vn/6VOZQ2zKfL" },
    { image:"images/06.jpg", title:"Nhậm tiểu thư và ngũ quái", description:"Khám phá ngay", link:"https://s.shopee.vn/30ohFcvp3I" },
    { image:"images/07.jpg", title:"Sau khi học ngọc nữ tâm khinh", description:"Khám phá ngay", link:"https://s.shopee.vn/5LCc1vYr5v" },
    { image:"images/08.jpg", title:"Sau khi học ngọc nữ tâm khinh p2", description:"Khám phá ngay", link:"https://s.shopee.vn/80DNCqWxfh" },
    { image:"images/09.jpg", title:"Đại tiểu thư và tên quản gia", description:"Khám phá ngay", link:"https://s.shopee.vn/50ZldPKyz0" },
    { image:"images/10.jpg", title:"Hai chị em nhà họ Hạ cùng dân hiến cho tôi", description:"Khám phá ngay", link:"https://s.shopee.vn/2LZ0SXPNQQ" },
    { image:"images/11.jpg", title:"Hoa khôi muốn làm con mèo nhỏ của tôi", description:"Khám phá ngay", link:"https://s.shopee.vn/3B87S58X4u" }
  ]
};
/* ======================= HẾT KHU VỰC CHỈNH SỬA ======================= */

// PHẦN HIỂN THỊ TỰ ĐỘNG — KHÔNG CẦN SỬA
const motionBtn=document.getElementById("motionToggle");
const bg=document.getElementById("fantasy-bg");
const reducedMotion=window.matchMedia("(prefers-reduced-motion: reduce)").matches;
let motionEnabled=CONFIG.animatedBackground && !reducedMotion;
function applyMotion(){
  document.body.classList.toggle("motion-off",!motionEnabled);
  motionBtn.textContent=motionEnabled?"✦ Tắt nền động":"✧ Bật nền động";
  motionBtn.setAttribute("aria-pressed",String(motionEnabled));
  bg.replaceChildren();
  if(!motionEnabled)return;
  const count=window.innerWidth<650?13:27;
  const fragment=document.createDocumentFragment();
  for(let i=0;i<count;i++){
    const petal=document.createElement("span");petal.className="fantasy-petal";
    petal.style.left=(i*37.7%100)+"%";
    petal.style.setProperty("--size",(8+(i*7%10))+"px");
    petal.style.setProperty("--opacity",String(.25+(i%5)*.1));
    petal.style.setProperty("--duration",(13+i%12)+"s");
    petal.style.setProperty("--delay",(-i*1.7)+"s");
    fragment.append(petal);
  }
  for(let i=0;i<(window.innerWidth<650?14:32);i++){
    const spark=document.createElement("span");spark.className="fantasy-spark";
    spark.style.left=(i*41.37%100)+"%";spark.style.top=(i*27.19%100)+"%";
    spark.style.setProperty("--size",(1+i%3)+"px");
    spark.style.setProperty("--duration",(2+i%5)+"s");
    spark.style.setProperty("--delay",(-i*.4)+"s");
    fragment.append(spark);
  }
  bg.append(fragment);
}
motionBtn.addEventListener("click",()=>{motionEnabled=!motionEnabled;applyMotion()});
applyMotion();
const byId = id => document.getElementById(id);
const setText = (id, value) => byId(id).textContent = value;
const safeLink = url => /^https:\/\//i.test(url) ? url : "https://shopee.vn/";
document.title = CONFIG.websiteName + " | " + CONFIG.pageTitle;
setText("logo", CONFIG.websiteName);
setText("eyebrow", CONFIG.smallLabel);
setText("pageTitle", CONFIG.pageTitle);
setText("pageDescription", CONFIG.pageDescription);
setText("sectionTitle", CONFIG.sectionTitle);
setText("footer", CONFIG.footerText);
byId("heroImage").src = CONFIG.banner.image;
byId("heroLink").href = safeLink(CONFIG.banner.link);
setText("heroLabel", CONFIG.banner.label);
setText("heroTitle", CONFIG.banner.title);
setText("heroDescription", CONFIG.banner.description);
setText("heroButton", CONFIG.banner.button);
setText("itemCount", CONFIG.items.length + " bộ sưu tập");
const cards = byId("cards");
const searchBox=byId("catalogSearch");
const menu=byId("catalogMenu");
const icons=["⌂","▦","▤","◉","▦","✓","♜","☆"];
let activeCategory=0;
CONFIG.menuNames.forEach((name,i)=>{
 const btn=document.createElement("button");btn.type="button";btn.className=i===0?"active":"";
 const symbol=document.createElement("span");symbol.className="menu-icon";symbol.textContent=icons[i]||"◇";
 btn.append(symbol,document.createTextNode(name));
 btn.addEventListener("click",()=>{
   activeCategory=i;
   menu.querySelectorAll("button").forEach((b,j)=>b.classList.toggle("active",i===j));
   renderCatalog();
   byId("gallery").scrollIntoView({behavior:"smooth",block:"start"});
 });
 menu.append(btn);
});
searchBox.addEventListener("input",renderCatalog);
function renderCatalog(){
 const q=searchBox.value.trim().toLocaleLowerCase("vi");
 const all=Array.from(cards.querySelectorAll(".card"));
 let visible=0;
 all.forEach((card,i)=>{
   const item=CONFIG.items[i];
   const matchesText=(item.title+" "+item.description).toLocaleLowerCase("vi").includes(q);
   // Các nhóm là chế độ demo, chia ảnh có sẵn để thử menu.
   const matchesCategory=activeCategory===0||activeCategory===1||((i+(activeCategory-2))%3!==0);
   const show=matchesText&&matchesCategory;
   card.hidden=!show;card.style.display=show?"":"none";if(show)visible++;
 });
 let empty=byId("catalogEmpty");
 if(!visible&&!empty){empty=document.createElement("div");empty.id="catalogEmpty";empty.className="search-empty";empty.textContent="Không tìm thấy nội dung phù hợp.";cards.append(empty)}
 if(empty)empty.hidden=visible>0;
 setText("itemCount",visible+" / "+CONFIG.items.length+" bộ sưu tập");
}

CONFIG.items.forEach((item,index)=>{
  const a=document.createElement("a");a.className="card";a.href=safeLink(item.link);a.target="_blank";a.rel="noopener noreferrer sponsored";
  const cover=document.createElement("div");cover.className="cover";
  const img=document.createElement("img");img.src=item.image;img.alt=item.title;img.loading="lazy";
  const tag=document.createElement("span");tag.className="tag";tag.textContent="MỤC "+String(index+1).padStart(2,"0");
  cover.append(img,tag);
  const info=document.createElement("div");info.className="info";
  const title=document.createElement("h3");title.textContent=item.title;
  const desc=document.createElement("p");desc.textContent=item.description;
  const view=document.createElement("span");view.className="view";view.textContent="Xem ngay ↗";
  info.append(title,desc,view);a.append(cover,info);cards.append(a);
});
renderCatalog();
</script>
